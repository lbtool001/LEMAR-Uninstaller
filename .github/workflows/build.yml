
name: Build LEMAR Uninstaller

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore LEMAR.Uninstaller.csproj

      - name: Build application
        run: dotnet build LEMAR.Uninstaller.csproj --configuration Release --no-restore

      - name: Publish Windows application
        run: dotnet publish LEMAR.Uninstaller.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -o publish

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LEMAR-Uninstaller-Windows-x64
          path: publish/
